name: Build mods

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
    tags:
      - 'mods-v*'
  pull_request:
    paths:
      - 'packages/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Build order matters: paint-craft and structure-stash both compile against
      # asset-shelf's jar via a relative file path (../asset-shelf/build/libs/...),
      # not a proper Gradle multi-project build, so asset-shelf must build first.
      - name: Build asset-shelf
        working-directory: packages/asset-shelf
        run: ./gradlew build

      # paint-craft compiles against Create + its bundled Flywheel/Ponder classes
      # (compileOnly, for optional contraption-decal support). These jars aren't
      # committed to git; fetch Create from Modrinth and pull Flywheel/Ponder out
      # of its own META-INF/jarjar bundle, since they aren't published standalone.
      - name: Fetch Create compile-time libs
        run: |
          mkdir -p packages/paint-craft/libs
          curl -sL -o packages/paint-craft/libs/create-1.21.1-6.0.10.jar \
            https://cdn.modrinth.com/data/LNytGWDc/versions/UjX6dr61/create-1.21.1-6.0.10.jar
          echo "11cc8fc049d2f67f6548c7abfada6b82a3adb5c7ca410a742de04bbca76e03862c518721b88d806f6e6d768a4d68531fdb903a85859b25d1484d550cc7bafd4b  packages/paint-craft/libs/create-1.21.1-6.0.10.jar" | sha512sum -c -
          unzip -o -j packages/paint-craft/libs/create-1.21.1-6.0.10.jar \
            "META-INF/jarjar/flywheel-neoforge-1.21.1-1.0.6.jar" \
            "META-INF/jarjar/ponder-neoforge-1.0.82+mc1.21.1.jar" \
            -d packages/paint-craft/libs

      - name: Build paint-craft
        working-directory: packages/paint-craft
        run: ./gradlew build

      - name: Build structure-stash
        working-directory: packages/structure-stash
        run: ./gradlew build

      - name: Collect jars
        run: |
          mkdir -p dist
          cp packages/asset-shelf/build/libs/assetshelf-*.jar dist/
          cp packages/paint-craft/build/libs/paintcraft-*.jar dist/
          cp packages/structure-stash/build/libs/structurestash-*.jar dist/
          sha256sum dist/*.jar | tee dist/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: mod-jars
          path: dist/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/mods-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.jar
            dist/SHA256SUMS
