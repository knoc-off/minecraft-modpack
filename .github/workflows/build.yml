name: Build PaintCraft

on:
  push:
    paths:
      - 'packages/paint-craft/**'
  pull_request:
    paths:
      - 'packages/paint-craft/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/paint-craft

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Compile
        run: ./gradlew classes

      - name: Build JAR
        run: ./gradlew jar
