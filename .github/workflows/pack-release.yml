name: Release pack

on:
  push:
    tags:
      - 'pack-v*'
  # Lets you dry-run the export without cutting a release; the publish step
  # below stays gated on the tag ref, so a manual run only produces an artifact.
  workflow_dispatch:

concurrency:
  group: pack-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v22

      # `packwiz refresh` rebuilds index.toml (and pack.toml's index hash) from
      # the mod files actually on disk, so the exported mrpack is correct by
      # construction instead of depending on the committed index being fresh.
      # nix/mods.nix is deliberately not touched here: it feeds the nix build
      # path and has no bearing on the mrpack.
      - name: Export mrpack
        run: |
          cd pack
          nix develop .. --command packwiz --yes refresh
          nix develop .. --command packwiz --yes modrinth export \
            --output "../bricks-building-extended-${GITHUB_REF_NAME#pack-v}.mrpack"

      - uses: actions/upload-artifact@v4
        with:
          name: mrpack
          path: bricks-building-extended-*.mrpack

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/pack-v')
        uses: softprops/action-gh-release@v2
        with:
          files: bricks-building-extended-*.mrpack
