plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("src/generated/**/.cache")
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                '--output', file('src/generated/resources/').getAbsolutePath(),
                '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// The orientation math (FaceFrame/DisplayTransform/PixelGrid) is pure and only needs Direction,
// but that class still has to be on the test compile classpath.
neoForge.addModdingDependenciesTo(sourceSets.test)

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    compileOnly files("${projectDir}/../asset-shelf/build/libs/assetshelf-0.1.0.jar")

    // Create + its render stack (Flywheel, Catnip-via-Ponder) — optional compat, compile-only.
    compileOnly files("${projectDir}/libs/create-1.21.1-6.0.10.jar")
    compileOnly files("${projectDir}/libs/flywheel-neoforge-1.21.1-1.0.6.jar")
    compileOnly files("${projectDir}/libs/ponder-neoforge-1.0.82+mc1.21.1.jar")

    // Orientation math (FaceFrame/DisplayTransform/PixelGrid) touches only Direction, a plain
    // enum, so it unit-tests without a Minecraft bootstrap.
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

repositories {
    mavenCentral()
}

tasks.named('test', Test) {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'failed', 'skipped'
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version            : neo_version,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// PolyForm Noncommercial 1.0.0 "Notices" requires that anyone who receives a
// copy of this jar also receives the license terms and the Required Notice lines.
tasks.named('jar', Jar) {
    from("${projectDir}/../../LICENSE") { into 'META-INF' }
    from("${projectDir}/../../NOTICE") { into 'META-INF' }
}

var jarTask = tasks.named('jar')
tasks.register('install', Copy) {
    dependsOn jarTask
    from jarTask.flatMap { it.archiveFile }
    into "${projectDir}/../../local-mods"
}
